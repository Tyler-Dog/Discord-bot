services:
  discord-bot:
    build: .
    container_name: discord-bot
    env_file:
      - .env
    environment:
      # Inside the container the dashboard listens on all interfaces; the port is only
      # published to *your own computer* below, so no token is needed for local use.
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8787}
      DASHBOARD_ALLOW_NO_TOKEN: "true"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8787}:${DASHBOARD_PORT:-8787}"   # dashboard -> http://localhost:8787
    volumes:
      - ./data:/app/data
    restart: unless-stopped
